<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf" content="{{ csrf }}">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Workbench{% endblock %} · {{ site_name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="shell">
    <header class="rail">
      <a class="brand" href="/">
        <span class="brand-mark">TUA</span>
        {% if site_name and site_name != "TUA" %}
        <span class="brand-site">{{ site_name }}</span>
        {% endif %}
      </a>
      <nav class="nav">
        <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Workbench</a>
        <a href="/log" {% if path == "/log" %}aria-current="page"{% endif %}>Log</a>
      </nav>
      <p class="rail-version">{{ version }}</p>
    </header>
    <main class="main">
      {% if notice %}
      <p class="notice" role="status">{{ notice }}</p>
      {% endif %}
      {% block body %}{% endblock %}
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
